[workspace]
resolver = "3"
members = [
    "crates/chess-core",
    "crates/uci",
    "crates/engine-classical",
    "crates/engine-nnue",
    "crates/arena",
]

# Shared settings inherited by member crates via `field.workspace = true`.
[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mekstromjr/mekchess"

[workspace.dependencies]
# Internal crates referenced by path so versions stay in lockstep.
chess-core = { path = "crates/chess-core" }
uci = { path = "crates/uci" }

# Dev-only correctness oracle for perft cross-validation (Epic A5).
# Pulled in under [dev-dependencies] only, so its GPL-3.0 license never
# links into the shipped engine binaries.
# shakmaty = "0.30"

# Release profile tuned for engine throughput: a chess engine is a hot
# inner loop, and link-time optimization + a single codegen unit measurably
# raise nodes-per-second. Worth it for the binaries we benchmark.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
