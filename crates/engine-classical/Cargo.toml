[package]
name = "engine-classical"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Classical alpha-beta chess engine with handcrafted evaluation (Epic C)."

# The engine logic is a library so the in-process arena can call it directly,
# sharing chess-core types with no text round-trip.
[lib]
name = "engine_classical"
path = "src/lib.rs"

# The thin UCI wrapper is a separate binary, so the SAME engine also plugs into
# fast-chess, external GUIs, and the lichess bridge.
[[bin]]
name = "engine-classical-uci"
path = "src/bin/uci.rs"

[dependencies]
chess-core.workspace = true
uci.workspace = true
